name: brewlite

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite
      POSTGRES_DB: brewlite
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://brewlite:brewlite@db:5432/brewlite?schema=public
      JWT_SECRET: ${JWT_SECRET:-brewlite-docker-dev-secret-change-me}
      JWT_EXPIRES_IN: 1d
      # Mở bằng điện thoại: thêm địa chỉ IP của laptop, ví dụ http://localhost:3000,http://192.168.137.1:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Cổng thanh toán sandbox. VNPay: mã website và chuỗi bí mật lấy khi đăng ký merchant test,
      # điền vào file .env cạnh docker-compose.yml (không commit). MoMo để trống thì dùng khóa test công khai.
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      # Địa chỉ công khai của API để MoMo gọi IPN (khi có); ở máy cá nhân backend tự tra cứu cổng
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        # Trình duyệt gọi API qua cổng đã publish ra máy host.
        # Mở bằng điện thoại: đặt NEXT_PUBLIC_API_URL=http://<IP laptop>:4000 rồi build lại frontend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
