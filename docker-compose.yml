name: brewlite

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite
      POSTGRES_DB: brewlite
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewlite -d brewlite"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://brewlite:brewlite@db:5432/brewlite?schema=public
      JWT_SECRET: ${JWT_SECRET:-brewlite-docker-dev-secret-change-me}
      JWT_EXPIRES_IN: 1d
      # Mở bằng điện thoại: thêm địa chỉ IP của laptop, ví dụ http://localhost:3000,http://192.168.137.1:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
